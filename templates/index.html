{% extends "base.html" %}

{% block title %}Home - Scholarship Eligibility System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Student Details</h3>
            </div>
            <div class="card-body">
                <form action="/predict" method="POST">

                    <!-- Student Name -->
                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input type="text" name="name" class="form-control"
                               placeholder="Enter student's full name"
                               required maxlength="100" value="Priya Sharma">
                    </div>

                    <!-- Age + Gender -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="age" class="form-control"
                                   min="15" max="60" required value="22">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Gender</label>
                            <select name="gender" class="form-select" required>
                                <option value="Male">Male</option>
                                <option value="Female" selected>Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <!-- Category + Disability -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select name="category" class="form-select" required>
                                <option value="General">General</option>
                                <option value="OBC">OBC</option>
                                <option value="SC" selected>SC</option>
                                <option value="ST">ST</option>
                                <option value="EWS">EWS</option>
                                <option value="Minority">Minority</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Disability</label>
                            <select name="disability" class="form-select" required>
                                <option value="No">No</option>
                                <option value="Yes">Yes</option>
                            </select>
                        </div>
                    </div>

                    <!-- Education -->
                    <div class="mb-3">
                        <label class="form-label">Education Level</label>
                        <select name="education" class="form-select" required>
                            <option value="UG">UG (Undergraduate)</option>
                            <option value="PG">PG (Postgraduate)</option>
                            <option value="Technical">Technical</option>
                            <option value="Professional" selected>Professional</option>
                        </select>
                    </div>

                    <!-- Marks + Attendance + Income -->
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Marks (%)</label>
                            <input type="number" step="0.01" name="marks"
                                   class="form-control" min="0" max="100"
                                   required value="75">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Attendance (%)</label>
                            <input type="number" step="0.01" name="attendance"
                                   class="form-control" min="0" max="100"
                                   required value="85">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Family Income (Rs.)</label>
                            <input type="number" name="income" class="form-control"
                                   min="0" required value="200000">
                        </div>
                    </div>

                    <!-- Submit -->
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg px-5" id="submitBtn">
                            <span id="btnText">Check Eligibility</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                        </button>
                    </div>

                </form>

                <div class="text-center mt-3">
                    <a href="/dashboard" class="btn btn-outline-secondary">
                        View Analytics Dashboard →
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    document.querySelector("form").addEventListener("submit", function() {
        document.getElementById("btnText").textContent = "Analyzing...";
        document.getElementById("btnSpinner").classList.remove("d-none");
        document.getElementById("submitBtn").disabled = true;
    });
</script>

{% endblock %}
